<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Login</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <h1>Staff Login</h1>

    <div class="card">
        <p class="error" th:if="${param.error}">Wrong email or password</p>
        <p class="success" th:if="${param.logout}">You have been logged out</p>
        <p class="success" th:if="${param.registered}">Account created! You can log in now</p>
        <p class="success" th:if="${param.reset}">Password changed! Log in with your new password</p>

        <form th:action="@{/login}" method="post">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>

        <p><a th:href="@{/forgot-password}">Forgot password?</a></p>
        <p>No account yet? <a th:href="@{/register}">Create one</a></p>
    </div>

    <p><a th:href="@{/}">Back to kiosk</a></p>
</body>
</html>
