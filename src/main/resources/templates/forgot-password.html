<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <h1>Forgot Password</h1>

    <div class="card">
        <p>Type the email you signed up with and we will send you a link to reset your password.</p>

        <p class="success" th:if="${message}" th:text="${message}">Message</p>

        <form th:action="@{/forgot-password}" method="post">
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit">Send reset link</button>
        </form>

        <p><a th:href="@{/login}">Back to login</a></p>
    </div>
</body>
</html>
