<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <h1>Reset Password</h1>

    <div class="card">
        <div th:if="${invalid}">
            <p class="error">This reset link is invalid or has expired.</p>
            <p><a th:href="@{/forgot-password}">Ask for a new link</a></p>
        </div>

        <div th:if="${!invalid}">
            <p class="error" th:if="${error}" th:text="${error}">Error</p>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <input type="password" name="password" placeholder="New password (min 8 characters)" required>
                <input type="password" name="confirmPassword" placeholder="Confirm new password" required>
                <button type="submit">Change password</button>
            </form>
        </div>
    </div>
</body>
</html>
